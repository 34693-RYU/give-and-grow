<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Give & Grow</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            min-height: 100vh;
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* พื้นหลังเต็มหน้าจอ */
        .page {
            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            background-image:
                linear-gradient(
                    rgba(0, 120, 170, 0.15),
                    rgba(0, 80, 130, 0.55)
                ),
                url("background.jpg");

            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* กลุ่มปุ่ม */
        .buttons {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 100px;

            padding: 20px;
        }

        /* ปุ่ม */
        .button {
            width: 340px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: transparent;
            border: none;
            outline: none;
            box-shadow: none;

            text-decoration: none;
            cursor: pointer;

            transition: transform 0.3s ease;
        }

        /* รูปปุ่ม */
        .icon-image {
            width: 320px;
            height: 320px;

            object-fit: contain;
            display: block;

            transition:
                transform 0.3s ease,
                filter 0.3s ease;
        }

        /* เอฟเฟกต์ตอนเอาเมาส์ชี้ */
        .button:hover {
            transform: translateY(-10px);
        }

        .button:hover .icon-image {
            transform: scale(1.08);

            filter: drop-shadow(
                0 12px 15px rgba(0, 0, 0, 0.35)
            );
        }

        /* เอฟเฟกต์ตอนกด */
        .button:active {
            transform: scale(0.94);
        }

        /* หน้าจอขนาดกลาง */
        @media (max-width: 1200px) {

            .buttons {
                gap: 40px;
            }

            .button {
                width: 280px;
            }

            .icon-image {
                width: 270px;
                height: 270px;
            }
        }

        /* หน้าจอเล็ก */
        @media (max-width: 900px) {

            body {
                overflow-y: auto;
            }

            .page {
                position: relative;

                width: 100%;
                min-height: 100vh;
                height: auto;

                padding: 40px 0;
            }

            .buttons {
                flex-direction: column;
                gap: 35px;
            }

            .button {
                width: auto;
            }

            .icon-image {
                width: 280px;
                height: 280px;
            }
        }

        /* โทรศัพท์ */
        @media (max-width: 500px) {

            .icon-image {
                width: 240px;
                height: 240px;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <div class="buttons">

            <!-- เกม -->
            <a class="button" href="#">
                <img
                    src="game.png"
                    class="icon-image"
                    alt="เข้าเกม"
                >
            </a>

            <!-- ลงทะเบียน -->
            <a class="button" href="register.html">
                <img
                    src="register.png"
                    class="icon-image"
                    alt="ลงทะเบียน"
                >
            </a>

            <!-- แชร์ -->
            <a class="button" href="#">
                <img
                    src="share.png"
                    class="icon-image"
                    alt="แชร์กิจกรรม"
                >
            </a>

        </div>

    </div>

</body>

</html>
